services:
  - type: web
    name: formacao-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: formacao-db
          property: connectionString

databases:
  - name: formacao-db
    databaseName: formacaodb
    user: formacao_user
    plan: free
